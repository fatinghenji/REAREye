name: Push Chinese translations to Transifex

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/res/values-zh-rCN/strings.xml'

jobs:
  push-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Transifex CLI
        run: |
          curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash

      - name: Configure Transifex
        run: |
          echo "[https://app.transifex.com/nekostash/reareye]
          rest_hostname = https://rest.api.transifex.com
          token = ${{ secrets.TRANSIFEX_TOKEN }}" > ~/.transifexrc

      - name: Push Chinese translations
        run: |
          tx push -t --language zh_CN
